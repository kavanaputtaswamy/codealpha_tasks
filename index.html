<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcard Quiz App</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Flashcard Quiz App</h1>

        <div class="flashcard">
            <div id="question">Question will appear here</div>
            <div id="answer" class="hidden">Answer will appear here</div>
        </div>

        <button id="showAnswerBtn">Show Answer</button>

        <div class="navigation">
            <button id="prevBtn">Previous</button>
            <button id="nextBtn">Next</button>
        </div>

        <div class="management">
            <button id="addBtn">Add Card</button>
            <button id="editBtn">Edit Card</button>
            <button id="deleteBtn">Delete Card</button>
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
